name: publish

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build files
        run: ./gradlew build

      - name: read mod name, mod version and minecraft version
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'archives_base_name mod_version minecraft_version modrinth_id curseforge_id'

      - name: publish fabric
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ steps.properties.outputs.modrinth_id }}
          modrinth-featured: true
          modrinth-unfeature-mode: subset
          curseforge-id: ${{ steps.properties.outputs.curseforge_id }}

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric

          name: '${{ steps.properties.outputs.archives_base_name }}-fabric-${{ steps.properties.outputs.mod_version }}+${{ steps.properties.outputs.minecraft_version }}'
          version: '${{ steps.properties.outputs.mod_version }}+${{ steps.properties.outputs.minecraft_version }}-fabric'
          game-versions: |
            ${{ steps.properties.outputs.minecraft_version }}

          version-type: release
          version-resolver: exact

          dependencies: |
            fabric-api | depends | *
            cloth-config | depends | *
            libz | depends | *

          changelog-file: CHANGELOG.md

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

      - name: publish neoforge
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ steps.properties.outputs.modrinth_id }}
          modrinth-featured: true
          modrinth-unfeature-mode: subset
          curseforge-id: ${{ steps.properties.outputs.curseforge_id }}

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: neoforge

          name: '${{ steps.properties.outputs.archives_base_name }}-neoforge-${{ steps.properties.outputs.mod_version }}+${{ steps.properties.outputs.minecraft_version }}'
          version: '${{ steps.properties.outputs.mod_version }}+${{ steps.properties.outputs.minecraft_version }}-neoforge'
          game-versions: |
            ${{ steps.properties.outputs.minecraft_version }}

          version-type: release
          version-resolver: exact

          dependencies: |
            cloth-config | depends | *
            libz | depends | *

          changelog-file: CHANGELOG.md

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

      - name: read changelog
        id: changelog
        uses: juliangruber/read-file-action@v1
        with:
          path: 'CHANGELOG.md'

      - name: discord webhook
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          embed-title: "${{ steps.properties.outputs.archives_base_name }} ${{ steps.properties.outputs.mod_version }} for Minecraft ${{ steps.properties.outputs.minecraft_version }} has been released!"
          embed-description: "**Changelog**```md\n${{ steps.changelog.outputs.content }}```\n**Downloads**\n<:modrinth:1401269188215046265> https://modrinth.com/mod/${{ steps.properties.outputs.archives_base_name }}\n<:curseforge:1401269128412794901> https://www.curseforge.com/minecraft/mc-mods/${{ steps.properties.outputs.archives_base_name }}"
          embed-footer-text: "Have fun and be blessed!"
          embed-color: 0xFF8000
