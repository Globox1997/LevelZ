plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    version = "${mod_version}+${minecraft_version}"
    group = maven_group

    base {
        archivesName = "${archives_base_name}-${project.name}"
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net/')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.nucleoid.xyz/' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = Integer.parseInt(java_version)
    }

    tasks.withType(Jar).configureEach {
        def archivesBaseName = archives_base_name
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${archivesBaseName}" }
        }
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}

configure([project(':fabric'), project(':neoforge')]) {
    configurations {
        commonJava {
            canBeResolved = true
        }
        commonResources {
            canBeResolved = true
        }
    }

    dependencies {
        compileOnly(project(':common')) {
            def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
        commonJava(project(path: ':common', configuration: 'commonJava'))
        commonResources(project(path: ':common', configuration: 'commonResources'))
    }

    tasks.named('compileJava', JavaCompile) {
        dependsOn(configurations.commonJava)
        source(configurations.commonJava)
    }

    tasks.named('processResources', ProcessResources) {
        dependsOn(configurations.commonResources)
        from(configurations.commonResources)
    }

    tasks.named('sourcesJar', Jar) {
        dependsOn(configurations.commonJava)
        from(configurations.commonJava)
        dependsOn(configurations.commonResources)
        from(configurations.commonResources)
    }
}
