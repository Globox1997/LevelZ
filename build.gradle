plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.nucleoid.xyz/" }
}

loom {
    accessWidenerPath = file("src/main/resources/levelz.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LibZ
    api ("maven.modrinth:libz:${project.libz_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Cloth
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu
    compileOnly runtimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Wthit
    compileOnly ('maven.modrinth:wthit:fabric-21.0.0') {
        exclude(group: "net.fabricmc.fabric-api")
    }
	// Jade
    compileOnly ('maven.modrinth:jade:26.3.5+fabric') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // DragonLoot
	compileOnly ('maven.modrinth:dragonloot:1.2.0+26.3-fabric') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:26.3.824"
    // EMI
    //    compileOnly ('maven.modrinth:emi:1.1.22+1.21.1+fabric') {
    //        exclude(group: "net.fabricmc.fabric-api")
    //    }

    // PlaceHolder
    compileOnly ("eu.pb4:placeholder-api:3.2.0+26.3")
    // Inmis
    //    compileOnly ('maven.modrinth:inmis:2.8.1-1.21.1') {
    //        exclude(group: "net.fabricmc.fabric-api")
    //    }
    // Accessories
    //    compileOnly ('maven.modrinth:accessories:j6K4uRb7') {
    //        exclude(group: "net.fabricmc.fabric-api")
    //    }
    // CosmeticArmor
    //    modCompileOnly ('maven.modrinth:cosmetic-armor:1.5.0') {
    //		exclude(group: "net.fabricmc.fabric-api")
    //	}
    // TreeChop
    //    compileOnly ('maven.modrinth:treechop:0.19.2') {
    //		exclude(group: "net.fabricmc.fabric-api")
    //	}
    // Alloygery
    //    modCompileOnly ('maven.modrinth:alloygery:2.5.5+1.19.2') {
    //		exclude(group: "net.fabricmc.fabric-api")
    //	}
    // Spell-Engine
    compileOnly ('maven.modrinth:spell-engine:1.10.9+26.3-fabric') {
		exclude(group: "net.fabricmc.fabric-api")
	}
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
