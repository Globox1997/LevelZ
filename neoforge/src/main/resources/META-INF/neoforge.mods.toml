[[dependencies.levelz]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.levelz]]
modId = "cloth_config"
type = "required"
versionRange = "[${cloth_config_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.levelz]]
modId = "libz"
type = "required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
